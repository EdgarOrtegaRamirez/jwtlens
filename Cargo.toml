[package]
name = "jwtlens"
version = "0.1.0"
edition = "2021"
description = "A fast, secure JWT inspection & validation CLI tool"
authors = ["EdgarOrtegaRamirez"]
license = "MIT"
repository = "https://github.com/EdgarOrtegaRamirez/jwtlens"
homepage = "https://github.com/EdgarOrtegaRamirez/jwtlens"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "9.3"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
colored = "2.1"
hex = "0.4"
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
serde_json = "1.0"

[[bin]]
name = "jwtlens"
path = "src/main.rs"